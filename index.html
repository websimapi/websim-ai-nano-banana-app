<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nano Banana App</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "nanobanana": "./nanobanana.js",
                "app": "./app.js"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <h1>🍌 AI Nano Banana Prompt Generator 🤖</h1>
        <p>Enter your idea and let the Nano Banana AI enhance it!</p>

        <div class="input-container">
            <textarea id="user-prompt" placeholder="Describe your amazing application idea..."></textarea>
            <button id="generate-button">Generate Amazing Prompt</button>
        </div>

        <div id="loading" class="hidden">
            <img src="banana-spinner.png" alt="Loading Spinner" class="spinner">
            <p>Peeling the prompt... one nano slice at a time.</p>
        </div>

        <div id="result-container" class="hidden">
            <h2>✨ Amazing Application Prompt ✨</h2>
            <p id="generated-prompt"></p>
            <button id="copy-button">Copy Prompt</button>
        </div>
        
        <div id="error-message" class="hidden error">
            An unexpected error occurred. Please try again.
        </div>
    </div>
    <script type="module" src="app.js"></script>

</body>
</html>
